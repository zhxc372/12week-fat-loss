name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 scripts/data_export.py

      - name: Inject data
        run: |
          python3 -c "
          import json
          with open('web/data.json','r') as f: data = json.load(f)
          with open('web/index.html','r') as f: html = f.read()
          html = html.replace('__DATA_PLACEHOLDER__', json.dumps(data, ensure_ascii=False))
          with open('web/index.html','w') as f: f.write(html)
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
